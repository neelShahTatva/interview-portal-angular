<div class="submissions-page">
  <div class="page-header">
    <div>
      <h2>Submissions</h2>
      <p>All candidate submissions and AI evaluations</p>
    </div>
  </div>

  <div class="filters-card">
    <div class="search-box">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        placeholder="Search submissions..."
        [(ngModel)]="searchText"
        (input)="applyFilters()"
      />
    </div>
  </div>

  <app-grid
    [data]="pagedSubmissions"
    [columns]="columns"
    [actions]="actions"
    [config]="gridConfig"
    (actionClicked)="onGridAction($event)"
    (pageChanged)="onPageChanged($event)"
  />
</div>
