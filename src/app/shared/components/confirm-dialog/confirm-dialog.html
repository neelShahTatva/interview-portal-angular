<div class="confirm-dialog">

  <h2>Delete {{data?.title}}</h2>
  <p>
    Are you sure you want to delete
    <strong>{{ data?.name }}</strong>?
  </p>

  <!-- ACTIONS -->
  <div class="actions">
    <app-button
      variant="secondary"
      (btnClick)="cancel()"
    >
      Cancel
    </app-button>

    <app-button
      variant="danger"
      (btnClick)="confirm()"
    >
      Delete
    </app-button>
  </div>
</div>
